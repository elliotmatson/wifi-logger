; PlatformIO Project Configuration
; ESP32-C3 SuperMini with built-in 0.42" OLED — WiFi connectivity logger
;
; Board: ESP32-C3 SuperMini (0.42" OLED variant)
;   - OLED: SSD1306 72x40, I2C, SDA=GPIO5, SCL=GPIO6, addr 0x3C
;   - BOOT button: GPIO9 (active LOW)
;   - User LED: GPIO8 (active LOW on most variants)

[platformio]
default_envs = esp32-c3-supermini
name = wifi-logger
description = WiFi connectivity logger

[env:esp32-c3-supermini]
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_extra_dirs = 
check_skip_packages = yes
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino, espidf
board = esp32-c3-devkitm-1
upload_speed = 921600

; ESP32-C3 has a built-in USB-Serial JTAG controller — enable USB CDC so
; Serial.print works over the USB-C cable without a separate UART chip.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_ESP_IDF_LOG

lib_deps =
    olikraus/U8g2 @ 2.36.18
    tzapu/WiFiManager @ 2.0.17